# Scheduled data refresh (docs/data-catalogue.md). Downloads what is new from the scripted
# sources, rebuilds only the pages whose inputs changed (pipeline/data_refresh.py), checks the
# site still tests and builds, and opens or updates a pull request on the `data-refresh` branch
# for review. Nothing here deploys: merging the pull request does.
#
# When: the 12th and 26th of March, June, October and December. TRREB posts each quarter's
# community reports 8 to 12 weeks after it ends, so a run before they are up finds nothing new
# for prices and the next run picks them up. Runs in March also refresh the police files and
# housing, once the past year is complete. To run it by hand and choose the parts: Actions tab,
# Data refresh, Run workflow.
#
# Needs: Settings, Actions, General, "Allow GitHub Actions to create and approve pull requests".
# Housing also needs the `pipeline-inputs` release (scripts/publish-inputs.sh); without it,
# housing is skipped and the rest still runs.
name: Data refresh

on:
  schedule:
    - cron: "23 10 12,26 3,6,10,12 *"
  workflow_dispatch:
    inputs:
      prices:
        description: "Sale prices: TRREB's new quarters"
        type: boolean
        default: true
      rentals:
        description: "Short-term rentals: Inside Airbnb's new scrape"
        type: boolean
        default: true
      safety:
        description: "Safety: the police's crime files and KSI collisions"
        type: boolean
        default: false
      housing:
        description: "Housing: permits, the City's housing files, CMHC, StatCan series"
        type: boolean
        default: false

# The refresh itself (downloads, the pipeline's scripts, npm) runs with read access only. What it
# changed goes to a second job as a patch, and only that job, which runs no code from the
# downloads or from npm, may write: it opens or updates the pull request.
permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: America/Toronto  # date the files as Toronto does, not by the runner's UTC clock
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
      title: ${{ steps.refresh.outputs.title }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"  # the lock file's
          cache: pip
          cache-dependency-path: pipeline/requirements.lock

      - name: Install the pipeline's packages
        run: pip install -r pipeline/requirements.lock

      - name: Choose the parts
        id: parts
        env:
          EVENT: ${{ github.event_name }}
          PRICES: ${{ inputs.prices }}
          RENTALS: ${{ inputs.rentals }}
          SAFETY: ${{ inputs.safety }}
          HOUSING: ${{ inputs.housing }}
        run: |
          if [ "$EVENT" = schedule ]; then
            parts="prices rentals"
            if [ "$(date -u +%m)" = 03 ]; then parts="$parts safety housing"; fi
          else
            parts=""
            if [ "$PRICES" = true ]; then parts="$parts prices"; fi
            if [ "$RENTALS" = true ]; then parts="$parts rentals"; fi
            if [ "$SAFETY" = true ]; then parts="$parts safety"; fi
            if [ "$HOUSING" = true ]; then parts="$parts housing"; fi
          fi
          if [ -z "$parts" ]; then echo "::error::Choose at least one part"; exit 1; fi
          echo "parts=$parts" >> "$GITHUB_OUTPUT"

      - name: Refresh the data
        id: refresh
        env:
          PARTS: ${{ steps.parts.outputs.parts }}
          GH_TOKEN: ${{ github.token }}  # download.py --inputs reads the pipeline-inputs release
        run: python pipeline/data_refresh.py $PARTS --report "$RUNNER_TEMP/report.md"

      - name: Write the summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/report.md" ]; then cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.refresh.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Test and build the site
        if: steps.refresh.outputs.changed == 'true'
        run: |
          python -m unittest discover -s pipeline/tests
          npm ci
          npm test
          npm run build

      # only the refreshed data, never anything else the run left behind
      - name: Pack what changed
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git add -A pipeline web/public
          git diff --cached --binary > "$RUNNER_TEMP/refresh.patch"
          git diff --cached --stat | tail -1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.refresh.outputs.changed == 'true'
        with:
          name: refresh
          path: |
            ${{ runner.temp }}/refresh.patch
            ${{ runner.temp }}/report.md
          retention-days: 7

  propose:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: refresh
          path: ${{ runner.temp }}/refresh

      - name: Apply the refreshed data
        run: git apply --index "$RUNNER_TEMP/refresh/refresh.patch"

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: data-refresh
          base: main
          commit-message: ${{ needs.refresh.outputs.title }}
          title: ${{ needs.refresh.outputs.title }}
          body-path: ${{ runner.temp }}/refresh/report.md
          add-paths: |
            pipeline/
            web/public/
          delete-branch: true
